{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatMCA</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400&display=swap" rel="stylesheet">

  <!-- Code Highlight -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">

  <style>
    :root {
      --bg: #e8eef5;
      --surface: rgba(255, 255, 255, 0.9);
      --user-msg: #dbeafe;
      --bot-msg: #f3f4f6;
      --text-dark: #111827;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
    }

    body {
      font-family: 'Roboto', 'Google Sans', sans-serif;
      background: linear-gradient(135deg, #cfd9df, #e2ebf0);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page-container {
      max-width: 850px;
      width: 100%;
      height: 90vh;
      padding: 1rem;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--surface);
      border-radius: 1.5rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(8px);
    }
    .chat-header h1 {
      font-weight: 700;
      color: var(--accent);
    }

    /* Chat Box */
    .chat-box {
      flex-grow: 1;
      overflow-y: auto;
      padding: 1.5rem;
      scroll-behavior: smooth;
    }

    /* Messages */
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message {
      margin-bottom: 1.2rem;
      display: flex;
      animation: fade-in-up 0.3s ease-out;
      position: relative;
    }
    .message p {
      padding: 0.75rem 1.25rem;
      border-radius: 1.25rem;
      margin-bottom: 0;
      color: var(--text-dark);
      max-width: 70%;
      word-wrap: break-word;
    }
    .user-message { justify-content: flex-end; }
    .user-message p {
      background: var(--user-msg);
      border-bottom-right-radius: 0.25rem;
    }
    .bot-message { justify-content: flex-start; gap: 0.75rem; }
    .bot-message::before {
      content: '';
      display: block;
      width: 36px;
      height: 36px;
      background: var(--accent);
      -webkit-mask: url("https://cdn-icons-png.flaticon.com/512/4712/4712035.png") no-repeat center;
      -webkit-mask-size: 20px;
      mask: url("https://cdn-icons-png.flaticon.com/512/4712/4712035.png") no-repeat center;
      mask-size: 20px;
      border-radius: 50%;
    }
    .bot-message p {
      background: var(--bot-msg);
      border-bottom-left-radius: 0.25rem;
    }

    /* Input Area */
    .chat-input-container {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.9);
    }
    .chat-input {
      background: var(--bot-msg);
      border-radius: 2rem;
      padding: 0.5rem;
      display: flex;
      align-items: center;
    }
    .chat-input .form-control {
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .chat-input .btn {
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #fff;
      transition: background 0.3s ease;
    }
    .chat-input .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="chat-container">
      <!-- Header -->
      <header class="chat-header d-flex justify-content-between align-items-center">
        <h1 class="h6 mb-0 fw-bold">ChatMCA</h1>
        <a href="{% url 'new_chat' %}" class="btn btn-sm btn-outline-primary rounded-pill px-3">New Chat</a>
      </header>

      <!-- Messages -->
      <main class="chat-box" id="chat-box"></main>
      <div id="suggestions-placeholder"></div>
      <div class="text-center py-2" id="stop-generating-container" style="display: none;">
        <button id="stop-btn" class="btn btn-sm btn-danger">Stop generating</button>
      </div>

      <!-- Input -->
      <footer class="chat-input-container">
        <form id="chat-form">
          {% csrf_token %}
          <div class="input-group chat-input">
            <input type="text" id="user-input" class="form-control" placeholder="Type your message..." autocomplete="off" autofocus>
            <button class="btn" type="submit" aria-label="Send">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-arrow-up" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5z"/>
              </svg>
            </button>
          </div>
        </form>
      </footer>
    </div>
  </div>

  <!-- Session Data -->
  <script id="session-data" type="application/json">
    { "session_id": "{{ session_id }}", "history": {{ message_history_json|safe }} }
  </script>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
